services:
  docs:
    image: ${DOCS_IMAGE}
    container_name: ${DOCS_CONTAINER_NAME:-agents-js-docs}
    restart: unless-stopped
    ports:
      - "${DOCS_BIND_ADDRESS:-127.0.0.1}:${DOCS_PUBLISHED_PORT:-5180}:80"
    labels:
      io.agents-js.hostname: ${DOCS_HOSTNAME:-localhost}
      io.agents-js.service: agents-js-docs

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${DOCS_TUNNEL_CONTAINER_NAME:-agents-js-docs-tunnel}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    depends_on:
      - docs
    environment:
      - TUNNEL_URL=http://docs:80
    labels:
      io.agents-js.hostname: ${DOCS_HOSTNAME:-localhost}
      io.agents-js.service: agents-js-docs-tunnel
