name: CI

on:
  push:
    branches: [main, agents-js]
    paths:
      - ".dockerignore"
      - ".factory/**"
      - ".gitea/workflows/ci.yml"
      - "README.md"
      - "apps/**"
      - "biome.json"
      - "bun.lock"
      - "deploy/**"
      - "docs/**"
      - "libs/**"
      - "mise.toml"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - "typedoc.config.json"
      - "typedoc.tsconfig.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

# Stable (not run-scoped) cache dir so actions/cache can persist it across runs.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-install-cache
  DOCS_HOSTNAME: agents-js.bodal.dev
  DOCS_IMAGE_REPOSITORY: gitea.tail019e7.ts.net/jensbodal/agents-js/docs
  DOCS_STACK_FILE: deploy/docs.compose.yaml
  DOCS_STACK_NAME: agents-js-docs
  AGENTS_JS_ENABLE_MOCK_ACP_RUNTIME: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel superseded runs
        uses: ./.gitea/actions/cancel-superseded-runs
        with:
          gitea-token: ${{ secrets.GITEA_TOKEN }}

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Setup
        # Note: --frozen-lockfile was attempted as defense-in-depth here
        # (commit ed67821) but caused CI failures #460/461/462 with no
        # accessible logs (Gitea per-job log endpoint returning 500/404 —
        # observability gap tracked in V13). Reverted 2026-04-27 to
        # restore CI green; pre-commit lockfile-sync gate (also added in
        # ed67821) remains the primary defense and works locally. Re-add
        # the flag here once log visibility is restored and the runner-
        # specific failure mode can be diagnosed.
        run: bun run setup

      - name: Run checks
        run: bun run check

      - name: Run CI
        run: bun run ci

      - name: Run focused proof tests
        run: >
          bun test
          apps/web-ui/src/launch-config.test.ts
          apps/web-ui/src/status-bridge.test.ts
          packages/ui-components/tests/acp-chat-app.test.ts
          tests/e2e-surface.test.ts
          tests/process-utils.test.ts

      - name: ACP external-consumer smoke (release-gate parity with .github/workflows/ci.yml)
        env:
          AGENTS_JS_RC_DATE: ci-${{ github.run_id }}
        run: bun scripts/acp-external-consumer-smoke.ts

      - name: Build docs
        run: bun run docs:build

      - name: Pack validated docs artifact
        run: tar -C docs/.vitepress -cf docs-dist.tar dist

      # actions/upload-artifact@v4 uses a backend API Gitea Actions doesn't
      # support ("GHESNotSupportedError: @actions/artifact v2.0.0+ ... not
      # currently supported on GHES"). v3 targets the legacy artifact API
      # which Gitea's runner implementation does support. Keep pinned until
      # Gitea ships @actions/artifact v2-compatible support.
      - name: Upload validated docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: docs-dist-${{ github.sha }}
          path: docs-dist.tar
          if-no-files-found: error
          retention-days: 3

      - name: Notify build result
        if: ${{ !cancelled() }}
        run: |
          curl -s -X POST "${{ secrets.WEBHOOK_URL_BUILDS }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET_BUILDS }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "workflow": "${{ github.workflow }}"
            }' || true

  docs-publish:
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated docs artifact
        uses: actions/download-artifact@v3
        with:
          name: docs-dist-${{ github.sha }}
          path: .

      - name: Unpack validated docs artifact
        run: |
          mkdir -p docs/.vitepress
          tar -C docs/.vitepress -xf docs-dist.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.tail019e7.ts.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docs-runtime.Dockerfile
          push: true
          tags: |
            ${{ env.DOCS_IMAGE_REPOSITORY }}:latest
            ${{ env.DOCS_IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCS_IMAGE_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCS_IMAGE_REPOSITORY }}:buildcache,mode=max

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-publish
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Redeploy docs stack
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          DOCS_IMAGE: ${{ env.DOCS_IMAGE_REPOSITORY }}:${{ github.sha }}
          DOCS_HOSTNAME: ${{ env.DOCS_HOSTNAME }}
          DOCS_STACK_FILE: ${{ env.DOCS_STACK_FILE }}
          DOCS_STACK_NAME: ${{ env.DOCS_STACK_NAME }}
          PORTAINER_INSECURE_TLS: "1"
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
        run: bun scripts/deploy-docs-stack.ts

      - name: Notify docs deploy result
        if: ${{ !cancelled() }}
        run: |
          DURATION=$(($(date +%s) - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="agents-js docs deployed"
            BODY="Docs deployed in ${MINS}m ${SECS}s to https://${{ env.DOCS_HOSTNAME }}/"
            PRIORITY="normal"
          else
            TITLE="agents-js docs FAILED"
            BODY="Docs deploy failed after ${MINS}m ${SECS}s"
            PRIORITY="urgent"
          fi
          curl -s -X POST "${{ secrets.WEBHOOK_URL_BUILDS }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET_BUILDS }}" \
            -d "{\"title\":\"${TITLE}\",\"body\":\"${BODY}\",\"priority\":\"${PRIORITY}\",\"url\":\"https://gitea.tail019e7.ts.net/jensbodal/agents-js/actions\",\"idempotencyKey\":\"${{ github.sha }}-docs-${{ job.status }}\"}" || true
