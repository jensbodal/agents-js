name: Docs Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docs image tag to redeploy
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  DOCS_HOSTNAME: agents-js.bodal.dev
  DOCS_IMAGE_REPOSITORY: gitea.tail019e7.ts.net/jensbodal/agents-js/docs
  DOCS_STACK_FILE: deploy/docs.compose.yaml
  DOCS_STACK_NAME: agents-js-docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel superseded runs
        uses: ./.gitea/actions/cancel-superseded-runs
        with:
          gitea-token: ${{ secrets.GITEA_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Redeploy docs stack
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          DOCS_IMAGE: ${{ env.DOCS_IMAGE_REPOSITORY }}:${{ github.event.inputs.image_tag }}
          DOCS_HOSTNAME: ${{ env.DOCS_HOSTNAME }}
          DOCS_STACK_FILE: ${{ env.DOCS_STACK_FILE }}
          DOCS_STACK_NAME: ${{ env.DOCS_STACK_NAME }}
          PORTAINER_INSECURE_TLS: "1"
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
        run: bun scripts/deploy-docs-stack.ts

      - name: Notify deploy result
        if: ${{ !cancelled() }}
        run: |
          DURATION=$(($(date +%s) - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="agents-js docs redeployed"
            BODY="Manual docs deploy completed in ${MINS}m ${SECS}s to https://${{ env.DOCS_HOSTNAME }}/"
            PRIORITY="normal"
          else
            TITLE="agents-js docs redeploy FAILED"
            BODY="Manual docs deploy failed after ${MINS}m ${SECS}s"
            PRIORITY="urgent"
          fi
          curl -s -X POST "${{ secrets.WEBHOOK_URL_BUILDS }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET_BUILDS }}" \
            -d "{\"title\":\"${TITLE}\",\"body\":\"${BODY}\",\"priority\":\"${PRIORITY}\",\"url\":\"https://gitea.tail019e7.ts.net/jensbodal/agents-js/actions\",\"idempotencyKey\":\"${{ github.run_id }}-docs-manual-${{ job.status }}\"}" || true
