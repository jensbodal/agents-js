<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="fig1-title">
  <title id="fig1-title">The seven protocols composed by agents-js, grouped by layer</title>
  <desc>Blueprint-style diagram of four layers: Presentation (A2UI, AG-UI), Integration (A2A, MCP), Runtime (ACP), Wire (JSON-RPC 2.0, TOON).</desc>
  <defs>
    <marker id="ps-arrhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1712"/>
    </marker>
  </defs>

  <!-- Paper background and grid so the file reads correctly when viewed in isolation -->
  <rect width="520" height="520" fill="#e8dfc8"/>

  <!-- Crosshair ticks -->
  <g stroke="#1a1712" stroke-width="0.6" opacity="0.5">
    <line x1="10" y1="20" x2="20" y2="20"/>
    <line x1="20" y1="10" x2="20" y2="20"/>
    <line x1="500" y1="20" x2="510" y2="20"/>
    <line x1="500" y1="10" x2="500" y2="20"/>
    <line x1="10" y1="500" x2="20" y2="500"/>
    <line x1="20" y1="500" x2="20" y2="510"/>
    <line x1="500" y1="500" x2="510" y2="500"/>
    <line x1="500" y1="500" x2="500" y2="510"/>
  </g>

  <!-- Layer bands labels -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#3d352a" letter-spacing="2">
    <text x="30" y="72" opacity="0.7">§ PRESENTATION</text>
    <text x="30" y="202" opacity="0.7">§ INTEGRATION</text>
    <text x="30" y="332" opacity="0.7">§ RUNTIME</text>
    <text x="30" y="452" opacity="0.7">§ WIRE</text>
  </g>
  <g stroke="#a89c7e" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="30" y1="78" x2="490" y2="78"/>
    <line x1="30" y1="208" x2="490" y2="208"/>
    <line x1="30" y1="338" x2="490" y2="338"/>
    <line x1="30" y1="458" x2="490" y2="458"/>
  </g>

  <!-- Presentation -->
  <g>
    <rect x="90" y="92" width="140" height="70" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <rect x="90" y="92" width="140" height="14" fill="#1f3a5f"/>
    <text x="160" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#f1ead8" letter-spacing="2">PRESENTATION</text>
    <text x="160" y="132" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="26" fill="#1a1712">A2UI</text>
    <text x="160" y="150" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#3d352a">declarative blueprint</text>
  </g>
  <g>
    <rect x="290" y="92" width="140" height="70" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <rect x="290" y="92" width="140" height="14" fill="#1f3a5f"/>
    <text x="360" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#f1ead8" letter-spacing="2">PRESENTATION</text>
    <text x="360" y="132" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="26" fill="#1a1712">AG-UI</text>
    <text x="360" y="150" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#3d352a">streaming transport</text>
  </g>

  <!-- Integration -->
  <g>
    <rect x="90" y="222" width="140" height="70" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <rect x="90" y="222" width="140" height="14" fill="#2c4a3e"/>
    <text x="160" y="233" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#f1ead8" letter-spacing="2">INTEGRATION</text>
    <text x="160" y="262" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="26" fill="#1a1712">A2A</text>
    <text x="160" y="280" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#3d352a">remote agent ↔ agent</text>
  </g>
  <g>
    <rect x="290" y="222" width="140" height="70" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <rect x="290" y="222" width="140" height="14" fill="#2c4a3e"/>
    <text x="360" y="233" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#f1ead8" letter-spacing="2">INTEGRATION</text>
    <text x="360" y="262" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="26" fill="#1a1712">MCP</text>
    <text x="360" y="280" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#3d352a">tool + context exposure</text>
  </g>

  <!-- Runtime -->
  <g>
    <rect x="190" y="352" width="140" height="70" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <rect x="190" y="352" width="140" height="14" fill="#b89732"/>
    <text x="260" y="363" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#1a1712" letter-spacing="2">RUNTIME</text>
    <text x="260" y="392" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="26" fill="#1a1712">ACP</text>
    <text x="260" y="410" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#3d352a">host ↔ agent · stdio</text>
  </g>

  <!-- Wire -->
  <g>
    <rect x="90" y="472" width="140" height="28" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <text x="160" y="491" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="14" fill="#4a3f7a">JSON-RPC 2.0</text>
  </g>
  <g>
    <rect x="290" y="472" width="140" height="28" fill="#f1ead8" stroke="#1a1712" stroke-width="1.5"/>
    <text x="360" y="491" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="14" fill="#4a3f7a">TOON</text>
  </g>

  <!-- Edges -->
  <g stroke="#1a1712" stroke-width="1.1" fill="none">
    <path d="M160,162 C160,192 160,192 160,220" marker-end="url(#ps-arrhead)" opacity="0.75"/>
    <path d="M360,162 C360,192 360,192 360,220" marker-end="url(#ps-arrhead)" opacity="0.75"/>
    <path d="M230,127 C260,127 260,127 290,127" stroke-dasharray="3 3" marker-end="url(#ps-arrhead)" opacity="0.65"/>
    <path d="M160,292 C160,322 195,322 225,350" marker-end="url(#ps-arrhead)" opacity="0.75"/>
    <path d="M360,292 C360,322 325,322 295,350" marker-end="url(#ps-arrhead)" opacity="0.75"/>
    <path d="M225,422 C225,445 200,445 170,470" marker-end="url(#ps-arrhead)" opacity="0.8"/>
    <path d="M295,422 C295,445 320,445 350,470" marker-end="url(#ps-arrhead)" opacity="0.8"/>
    <path d="M230,486 C250,486 260,486 290,486" stroke-dasharray="3 3" marker-end="url(#ps-arrhead)" opacity="0.65"/>
  </g>

  <!-- Corner stamp -->
  <g transform="translate(430 432)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#b43a1c" stroke-width="1.2" stroke-dasharray="2 3"/>
    <text x="40" y="32" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="10" fill="#b43a1c">agents-js</text>
    <text x="40" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#b43a1c" letter-spacing="1">CERTIFIED</text>
    <text x="40" y="57" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="9" fill="#b43a1c">seven · in · one</text>
  </g>
</svg>
