name: Release

# Tag-driven publish to npm + GitHub Release.
#
# Trigger: pushing a tag that matches `v*` (e.g. `v0.2.1`, `v1.0.0-beta-1`).
#
# Flow:
#   1. `check` — full pre-publish gate (`bun run check` + `e2e:deterministic`).
#   2. `publish` — gated by the `npm-publish` GitHub environment, which is
#      configured with required reviewers in repo Settings → Environments.
#      Uses OIDC Trusted Publishers (`id-token: write` + `--provenance`); each
#      `@agents-js/*` package on npmjs.com must have a Trusted Publisher entry
#      pointing at this workflow file (`release.yml`) and this environment
#      (`npm-publish`). No NPM_TOKEN is stored in the repo.
#   3. `github-release` — creates the GitHub Release page with notes from the
#      matching `## [<version>]` section of `CHANGELOG.md`.
#
# Coupling to docs deploy: `.github/workflows/docs-deploy.yml` triggers via
# `workflow_run` on this workflow's success — see that file for details.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun run setup --ci
      - run: bun run check
      - run: bun run e2e:deterministic

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/org/agents-js
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # mise-action installs Node + Bun from `mise.toml` (Node 24, Bun 1.3.12).
      # Single source of truth for the toolchain — don't layer `actions/setup-node`
      # on top, which would pull a different Node major and cause subtle
      # publish-time differences (npm version skew, lockfile interpretation, etc.).
      - uses: jdx/mise-action@v4
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun run setup --ci
      - name: Publish all 18 packages with provenance
        env:
          AGENTS_JS_PUBLISH_REGISTRY: https://registry.npmjs.org/
          # `--provenance` triggers OIDC token exchange against the npm registry,
          # which uses the per-package Trusted Publisher config to authorize the
          # publish. No long-lived token required. publish-all.ts passes
          # `npm publish --registry $AGENTS_JS_PUBLISH_REGISTRY` so npm knows the
          # registry without needing setup-node's `~/.npmrc` side effect.
          NPM_CONFIG_PROVENANCE: "true"
        run: bun scripts/publish-all.ts --no-dry-run

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Bound to env so user-influenceable values never reach `run:` via
      # `${{ }}` interpolation (workflow-injection hardening). Tag refs are
      # git-validated and unlikely to carry shell metachars, but the env-var
      # pattern is the safe default.
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Extract the section between `## [<version>]` and the next `## [`.
          awk -v ver="$version" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" ver "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release-notes section for [$version] not found in CHANGELOG.md" >&2
            echo "_No CHANGELOG entry found for v${version}._" > /tmp/release-notes.md
          fi
          # Persist `version` (and a derived `is_prerelease` flag) on the
          # step's outputs object via $GITHUB_OUTPUT so the next step can
          # consume them without shell interpolation across the boundary.
          # Heredoc syntax (`name<<EOF ... EOF`) preserves literal text, so
          # any future multi-line value won't be split on newlines.
          {
            echo "version<<EOF"
            echo "$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Detect a SemVer prerelease segment (anything after `-`) so the
          # next step can mark prerelease tags accordingly. Bare `vX.Y.Z`
          # tags get `--latest`; `vX.Y.Z-beta-1`, `-rc.2`, etc. get
          # `--prerelease`. Glob match is sufficient — the prerelease
          # discriminator in SemVer is the literal `-` after the patch.
          if [ "$version" != "${version%%-*}" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          IS_PRERELEASE: ${{ steps.notes.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # `--latest` vs `--prerelease` is mutually exclusive on GitHub
          # Releases. Marking a prerelease as `--latest` would surface it on
          # the repo landing page and to consumers tracking "the newest
          # release" — wrong for a `-beta-N` or `-rc.N` tag.
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flag="--prerelease"
          else
            release_flag="--latest"
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "$release_flag"
