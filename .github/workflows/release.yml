name: release-please

# release-please-driven release flow.
#
# On every push to main, the release-please job either opens/updates a release
# PR (titled "chore(main): release X.Y.Z") containing a CHANGELOG.md update and
# a root package.json version bump (plus all 18 publishable packages/* via
# extra-files), or — if THIS push was the merge of a release PR — creates the
# tag and GitHub Release.
#
# When a release is created, the publish job runs: it checks out the freshly
# tagged commit, runs the full pre-publish gate, and publishes all 18 packages
# to npm with OIDC + provenance via Trusted Publishers. No NPM_TOKEN secret.
#
# IMPORTANT: each `@agents-js/*` package on npmjs.com has a Trusted
# Publisher entry pointing at THIS workflow file (`release.yml`) and the
# `npm-publish` environment. The filename `release.yml` is deliberately
# preserved across the tag-driven → release-please cutover so the existing
# 18 TP bindings continue to authorize OIDC `npm publish --provenance`
# without per-package re-binding on npmjs.com. Do NOT rename this file.
#
# Outputs from release-please-action@v5 (root component shape):
#   - release_created (singular, NOT releases_created) — true when a release
#     PR was just merged and the tag/Release was created in this run.
#   - tag_name — the tag (e.g. "v0.3.2") that was created.
# Both are top-level on the action's outputs because we use a single root
# component ("packages": { ".": ... } in release-please-config.json).

on:
  push:
    branches: [main]

# Workflow-level permissions cover the release-please job (open release PRs,
# create tags + GitHub Releases via GITHUB_TOKEN). The publish job overrides
# at the job level — it does not inherit `pull-requests: write` and tightens
# `id-token` to where it's actually needed (npm OIDC). `id-token: write` is
# NOT granted at workflow level because the release-please job has no OIDC
# exchange to perform.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Checkout main solely so the post-release sync step can install Bun
      # via mise-action (reads `mise.toml`). release-please-action itself
      # operates against the GitHub API and does not need a checkout.
      - uses: actions/checkout@v6
      # Install Bun pinned to the version in `mise.toml` (1.3.12). Same
      # toolchain as the publish + ci jobs — using `curl bun.sh/install`
      # here would float to an unpinned Bun and could regenerate bun.lock
      # in a way that the publish job's pinned Bun then rejects under
      # `--frozen-lockfile`.
      - uses: jdx/mise-action@v4

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps each `packages/*/package.json#version` via
      # extra-files, but it cannot follow that bump through to:
      #   1. cross-package `dependencies."@agents-js/*"` references inside
      #      `packages/*` and `extras/*` package.jsons, and
      #   2. the bun.lock workspace entries that crystallize those versions.
      # Without this step, the release PR ships package.json#version=X but
      # leaves dependencies pinned at X-1 and bun.lock referencing X-1, so
      # `bun install --frozen-lockfile` in the publish job blows up and
      # `release:preflight` flags the dep-version mismatch.
      #
      # `scripts/bump.ts` reads the root package.json#version and propagates
      # it to every internal manifest (version + cross-package deps), then
      # runs `bun install` to refresh the lockfile. Push the result onto the
      # release PR branch.
      #
      # No-op when no PR was opened/updated (the post-merge run that creates
      # the tag has empty `steps.release.outputs.pr`).
      - name: Sync internal deps + bun.lock onto release PR branch
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')
          if [ -z "$PR_BRANCH" ] || [ "$PR_BRANCH" = "null" ]; then
            echo "release-please did not expose a headBranchName; skipping sync"
            exit 0
          fi
          echo "Syncing internal deps + bun.lock onto release PR branch: $PR_BRANCH"

          WORK=$(mktemp -d)
          git clone --depth=1 --branch "$PR_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$WORK"
          cd "$WORK"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # bun is already on PATH from `jdx/mise-action@v4` above (pinned
          # to mise.toml's bun version). bump.ts propagates root version →
          # every internal manifest's version + cross-package deps, then
          # runs `bun install` to sync bun.lock. Idempotent.
          bun scripts/bump.ts

          if git diff --quiet; then
            echo "no drift after bump.ts; PR branch is already in sync"
            exit 0
          fi

          git add -A
          git commit -m "chore: sync internal deps + bun.lock for release"
          git push origin "$PR_BRANCH"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/org/agents-js
    permissions:
      # contents: write is required for `peter-evans/repository-dispatch` to
      # POST /repos/{owner}/{repo}/dispatches against this same repo using
      # GITHUB_TOKEN. With contents: read the dispatch step would 403 and
      # docs-deploy would silently never fire after a real release. Do NOT
      # tighten back to `read`.
      # id-token: write is required for the OIDC token exchange against the
      # npm registry's Trusted Publisher, which authorizes `npm publish
      # --provenance` without a long-lived NPM_TOKEN.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin to the exact commit/tag release-please just created. Prevents
          # publishing a moving-target view of main if anything else lands
          # between release-please tagging and this job starting.
          ref: ${{ needs.release-please.outputs.tag_name }}
      # mise-action installs Node + Bun from `mise.toml` (Node 24, Bun 1.3.12).
      # Single source of truth for the toolchain — don't layer `actions/setup-node`
      # on top, which would pull a different Node major and cause subtle
      # publish-time differences (npm version skew, lockfile interpretation, etc.).
      - uses: jdx/mise-action@v4
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun run setup --ci
      - run: bun run check
      - name: Publish all 18 packages with provenance
        env:
          AGENTS_JS_PUBLISH_REGISTRY: https://registry.npmjs.org/
          # `--provenance` triggers OIDC token exchange against the npm registry,
          # which uses the per-package Trusted Publisher config to authorize the
          # publish. No long-lived token required. publish-all.ts passes
          # `npm publish --registry $AGENTS_JS_PUBLISH_REGISTRY` so npm knows the
          # registry without needing setup-node's `~/.npmrc` side effect.
          NPM_CONFIG_PROVENANCE: "true"
        run: bun scripts/publish-all.ts --no-dry-run

      # Fire docs-deploy ONLY after a successful publish. We use
      # repository_dispatch instead of letting docs-deploy listen on
      # workflow_run because release-please runs on every main push (no-op
      # runs still "succeed"), and we don't want docs to redeploy on every
      # commit — only on actual releases. The tag is carried in
      # client_payload so docs-deploy can check out the exact tree the npm
      # artifacts came from.
      # tag_name comes from release-please-action's own output (format
      # `vX.Y.Z`), not from any user-controllable input, so direct
      # interpolation here is safe — there's no injection surface.
      - name: Trigger docs-deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: release-published
          client-payload: '{"tag":"${{ needs.release-please.outputs.tag_name }}"}'
