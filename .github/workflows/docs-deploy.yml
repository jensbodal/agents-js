name: Docs Deploy

# Triggered by a `repository_dispatch` event (`release-published`) fired by
# the `release-please` workflow's publish job AFTER npm publish succeeds.
# The intent is "docs deploy is part of the release act, not a per-merge
# artifact." Manual `workflow_dispatch` remains supported for emergency
# redeploys.
#
# Why `repository_dispatch` and not `workflow_run`:
#   release-please runs on EVERY push to main (it's how the release PR stays
#   current). Even when no release happens, that run "succeeds." A
#   `workflow_run` trigger filtered on `conclusion == 'success'` would
#   therefore fire on every main push and redeploy docs built from main HEAD,
#   not from the released tag. That's a real cadence/cost regression AND a
#   correctness regression — the published site would advertise APIs that
#   aren't in any released package yet. `workflow_run` payload exposes the
#   parent's conclusion but not its job outputs, so we can't filter on
#   "release-please actually created a release" from this side.
#   `repository_dispatch` lets the publish job fire the trigger only on the
#   release-created branch of its own conditional logic, with the released
#   tag carried in `client_payload.tag` so we can check out exactly the tree
#   the npm artifacts came from.
#
# `client_payload.tag` is empty for `workflow_dispatch`, so checkout falls
# back to the default ref (main HEAD) for emergency redeploys.

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

# Pages best practice: queue deploys, do not cancel a deploy that is already
# publishing. cancel-in-progress is false on purpose.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # `repository_dispatch` only fires from the release-please publish job
    # AFTER npm publish succeeds (see release.yml), so any incoming
    # event of type `release-published` already implies a successful release.
    # `workflow_dispatch` always runs (manual override).
    runs-on: ubuntu-latest
    steps:
      # Pin checkout to the released tag carried in client_payload.tag.
      # release.yml's publish job sends the dispatch with the tag it
      # just published, which guarantees the docs we build correspond exactly
      # to the npm artifacts on the registry. Drift-free.
      #
      # `client_payload.tag` is empty for `workflow_dispatch`, so checkout
      # falls back to the dispatching ref (default branch) for manual reruns.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.tag }}
      - uses: jdx/mise-action@v4
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mise.toml', 'bun.lock') }}
      # docs:build internally runs: docs:api -> docs:index -> vitepress build docs.
      # No additional generation steps are required here: docs:reference and
      # docs:bundle are committed-tree artifacts gated by `bun run check` in
      # ci.yml (via docs:reference:check and docs:bundle:check). If those gates
      # are red on `main`, ci.yml fails on the same push; this workflow does
      # not duplicate them, but does rely on them being green to publish a
      # fresh artifact.
      #
      # Keep this as a mise task so local shells, devcontainers, and Actions run
      # the same docs deploy build proof:
      #   mise run docs:deploy-build
      - run: mise run docs:deploy-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>pages.err; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -q "HTTP 404" pages.err; then
            cat pages.err >&2
            exit 1
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          {
            echo "## GitHub Pages is not enabled"
            echo
            echo "The docs artifact was built and uploaded, but deployment was skipped because this repository does not yet have Pages configured to build from GitHub Actions."
            echo
            echo "Enable Pages in repository settings, choose GitHub Actions as the source, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
