name: Docs Deploy

# Triggered by a successful `Release` workflow run (which itself fires on tag
# push and goes through the manual `npm-publish` environment gate). The intent
# is "docs deploy is part of the release act, not a per-merge artifact." Manual
# `workflow_dispatch` remains supported for emergency redeploys.
#
# Note on `workflow_run` triggers:
#   - The dependent workflow ALWAYS receives the event regardless of the
#     parent's conclusion. The `if:` guard on each job is what filters to
#     "only when Release succeeded" — without it, this would deploy stale docs
#     from a failed publish run.
#   - `github.ref` inside a `workflow_run`-triggered run is the default branch
#     (main), not the tag that triggered the parent. The parent's tag is
#     available via `github.event.workflow_run.head_branch`.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

# Pages best practice: queue deploys, do not cancel a deploy that is already
# publishing. cancel-in-progress is false on purpose.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # On `workflow_run`, run only when the Release workflow succeeded.
    # On `workflow_dispatch`, always run (manual override).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Pin checkout to the exact commit the parent Release workflow ran on.
      # Without this, `actions/checkout` on `workflow_run` defaults to the
      # repo's default branch HEAD, which can drift past the released tag if
      # main moves between the Release workflow finishing and docs-deploy
      # firing. We want the docs site at any given release URL to match the
      # source tree the published artifacts came from.
      #
      # `head_sha` is empty for `workflow_dispatch`, so checkout falls back to
      # the dispatching ref (default branch / selected branch) automatically.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v4
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mise.toml', 'bun.lock') }}
      # docs:build internally runs: docs:api -> docs:index -> vitepress build docs.
      # No additional generation steps are required here: docs:reference and
      # docs:bundle are committed-tree artifacts gated by `bun run check` in
      # ci.yml (via docs:reference:check and docs:bundle:check). If those gates
      # are red on `main`, ci.yml fails on the same push; this workflow does
      # not duplicate them, but does rely on them being green to publish a
      # fresh artifact.
      #
      # Keep this as a mise task so local shells, devcontainers, and Actions run
      # the same docs deploy build proof:
      #   mise run docs:deploy-build
      - run: mise run docs:deploy-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>pages.err; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -q "HTTP 404" pages.err; then
            cat pages.err >&2
            exit 1
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          {
            echo "## GitHub Pages is not enabled"
            echo
            echo "The docs artifact was built and uploaded, but deployment was skipped because this repository does not yet have Pages configured to build from GitHub Actions."
            echo
            echo "Enable Pages in repository settings, choose GitHub Actions as the source, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
