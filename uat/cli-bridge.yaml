- id: CLI-BRIDGE-HELP
  title: bridge --help prints usage and exits 0
  surface: agents-js/cli/bridge
  priority: P0
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'runBridgeCommand'
  test_name: 'prints help and exits 0'
  given:
    - agents-js CLI binary is available
  when:
    - User runs `agents-js bridge --help`
  then:
    - Exits 0
    - Output contains "agents-js v"
    - Output contains "bridge"
    - Output documents the --harness flag

- id: CLI-BRIDGE-PARSE-ARGS
  title: parseBridgeCommandArgs accepts the documented bridge flags
  surface: agents-js/cli/bridge
  priority: P1
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'parseBridgeCommandArgs'
  test_name: 'parses --harness opencode'
  given:
    - argv contains the supported bridge flags
  when:
    - parseBridgeCommandArgs runs
  then:
    - --harness is captured onto args.harness
    - --host / --port / --runtime-log-level / --default-model are captured
    - --opencode-disable-external-plugins sets the bool flag
  notes: |
    Covers the full `parseBridgeCommandArgs` describe block in
    packages/cli/tests/bridge.test.ts — individual flag parses
    (--help, -h, --harness, --host, --port, --port 0, --runtime-log-level,
    --opencode-disable-external-plugins, --default-model). Also exercises
    the negative paths (unknown flag, missing --harness value, out-of-range
    --port, non-integer --port, unknown runtime-log-level) through the
    shared argv parser.

- id: CLI-BRIDGE-HARNESS-RESOLUTION
  title: bridge resolves a curated harness and hands acp + agentCard to serveGateway
  surface: agents-js/cli/bridge
  priority: P0
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'runBridgeCommand'
  test_name: 'invokes serveGateway with resolved runtime acp + agentCard'
  given:
    - A runtimeResolver that locates the opencode binary
    - A stub serveGateway and waitForShutdown
  when:
    - User runs `agents-js bridge --harness opencode --port 0`
  then:
    - serveGateway is called exactly once
    - Resolved acp.command points at the opencode binary
    - agentCard.name is "universal-acp-gateway"
    - host defaults to 127.0.0.1 and port passes through as 0

- id: CLI-BRIDGE-EPHEMERAL-LIFECYCLE
  title: bridge serves a single session and tears down via waitForShutdown
  surface: agents-js/cli/bridge
  priority: P0
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'runBridgeCommand'
  test_name: 'waitForShutdown resolves, stop() called, result returned'
  given:
    - A stub ServeACPOverA2AHandle that counts stop() calls
    - An injected waitForShutdown that resolves immediately
  when:
    - runBridgeCommand runs to completion
  then:
    - handle.stop() is invoked exactly once
    - Result reports the resolved runtime id (opencode)
    - Result.host is 127.0.0.1 and Result.port matches the handle port
    - Output reports "bridge serving <displayName>" with the bound port

- id: CLI-BRIDGE-ERROR-PATHS
  title: bridge surfaces missing / unknown harness with a clear exit code
  surface: agents-js/cli/bridge
  priority: P1
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'runBridgeCommand'
  test_name: 'returns 1 with clear message when --harness missing'
  given:
    - runBridgeCommand is invoked with no --harness, or with an unsupported harness value
  when:
    - runBridgeCommand runs
  then:
    - Exit code is 1
    - Output names the missing / unknown harness and lists supported runtimes
  notes: |
    Covers three adjacent negative tests in the `runBridgeCommand`
    describe block: "returns 1 with clear message when --harness missing",
    "returns 1 when --harness is not a known runtime", and
    "rejects unknown harness with supported-runtimes guidance". All three
    go through the same validation path and surface the "Unknown runtime"
    / "Missing required --harness" strings.

- id: CLI-BRIDGE-ENV-OVERRIDES
  title: bridge applies AJS_* env overrides before runtime resolution and restores them after
  surface: agents-js/cli/bridge
  priority: P1
  automation: automated
  test_file: packages/cli/tests/bridge.test.ts
  test_selector: 'runBridgeCommand'
  test_name: 'applies env overrides before runtime resolution and restores after'
  given:
    - The process env is snapshotted for AJS_DEFAULT_MODEL, AJS_RUNTIME_LOG_LEVEL, AJS_OPENCODE_DISABLE_EXTERNAL_PLUGINS
    - The runtimeResolver captures live env values at the moment `which()` runs
  when:
    - runBridgeCommand runs with --default-model / --runtime-log-level / --opencode-disable-external-plugins
  then:
    - During resolution, the AJS_* env vars reflect the CLI flag values
    - After runBridgeCommand returns, the AJS_* env vars match the pre-call snapshot
