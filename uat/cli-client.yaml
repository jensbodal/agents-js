- id: CLI-CLIENT-HELP
  title: client --help prints help without starting the app
  surface: agents-js/cli/client
  priority: P0
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'prints help without starting the app'
  given:
    - agents-js CLI is available
  when:
    - User runs `agents-js client --help`
  then:
    - Exits 0 with the client help banner
    - Does not launch the client app

- id: CLI-CLIENT-PARSE-FLAGS
  title: client parses url, headers, and flags
  surface: agents-js/cli/client
  priority: P0
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'parses url, headers, and flags'
  given:
    - A URL, custom headers, and assorted flags are supplied
  when:
    - The client parses its command-line arguments
  then:
    - All fields land in the parsed options object intact

- id: CLI-CLIENT-DELEGATE
  title: client delegates app launch for normal client mode
  surface: agents-js/cli/client
  priority: P0
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'delegates app launch for normal client mode'
  given:
    - Client is invoked in its default (non-help) mode
  when:
    - The command runs to the app-launch step
  then:
    - App delegate is invoked with the parsed options

- id: CLI-CLIENT-HEADER
  title: client header component reflects controller state
  surface: agents-js/cli/client
  priority: P1
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'header component reflects controller state'
  given:
    - A client session is running
  when:
    - The controller state transitions
  then:
    - The header widget reflects the new state

- id: CLI-CLIENT-INPUT-BAR-CLEAR
  title: client input bar clears the rendered input immediately after enter
  surface: agents-js/cli/client
  priority: P1
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'input bar clears the rendered input immediately after enter'
  given:
    - User has typed a prompt into the input bar
  when:
    - User presses Enter to submit
  then:
    - The visible input clears immediately
    - The submitted prompt is dispatched to the controller

- id: CLI-CLIENT-ELICITATION-RESET
  title: client input bar resets draft state on repeated elicitation with a new schema
  surface: agents-js/cli/client
  priority: P1
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'input bar resets draft state when a repeated elicitation uses the same message with a new schema'
  given:
    - An elicitation has been resolved
    - A new elicitation with a different schema but the same message arrives
  when:
    - The input bar re-renders
  then:
    - Prior draft state is cleared
    - The new schema is honored

- id: CLI-CLIENT-INTERRUPTION
  title: client transcript renders interruption prompts even without prior transcript entries
  surface: agents-js/cli/client
  priority: P1
  automation: automated
  test_file: packages/cli/tests/client.test.ts
  test_selector: 'client command'
  test_name: 'transcript renders interruption prompts even without prior transcript entries'
  given:
    - Transcript is empty
  when:
    - An interruption prompt arrives
  then:
    - The transcript renders the interruption block without requiring prior history
