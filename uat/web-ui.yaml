- id: WEB-UI-PERMISSION-RESOLUTION
  title: Permission resolution resolves rules to decisions
  surface: agents-js/web-ui
  priority: P0
  automation: automated
  test_file: apps/web-ui/src/permission-resolution.test.ts
  test_selector: 'createPermissionResolution'
  given:
    - A permission request and a set of rules
  when:
    - createPermissionResolution evaluates them
  then:
    - The correct decision (allow/reject/prompt) is returned
    - Rule attribution is preserved
  related:
    - XCUT-PERMISSION-PARITY

