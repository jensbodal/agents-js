- id: WEB-UI-LAUNCH-CONFIG
  title: Browser launch config resolves correctly
  surface: agents-js/web-ui
  priority: P0
  automation: automated
  test_file: apps/web-ui/src/launch-config.test.ts
  test_selector: 'resolveBrowserLaunchConfig'
  given:
    - Various browser launch input configurations
  when:
    - resolveBrowserLaunchConfig runs
  then:
    - The resolved config matches the expected shape for each input

- id: WEB-UI-LAUNCH-CONFIG-HOST-BRIDGE-ACTIVE
  title: isHostBridgeActiveForTarget checks active host bridge
  surface: agents-js/web-ui
  priority: P1
  automation: automated
  test_file: apps/web-ui/src/launch-config.test.ts
  test_selector: 'isHostBridgeActiveForTarget'
  given:
    - A set of target URLs and host bridge configurations
  when:
    - isHostBridgeActiveForTarget evaluates each target
  then:
    - Active/inactive is correctly reported per target

- id: WEB-UI-HOST-BRIDGE-URL
