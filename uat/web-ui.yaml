- id: WEB-UI-ELICITATION-PARITY
  title: Elicitation wire parity between gateway snapshot and HostWSClient
  surface: agents-js/web-ui
  priority: P0
  automation: automated
  test_file: apps/web-ui/src/ws-client.test.ts
  test_selector: 'HostWSClient'
  given:
    - A WSBridgeState snapshot carrying a pendingElicitation, or an
      elicitation_requested/elicitation_resolved event on the wire
  when:
    - mapSnapshot runs on the snapshot, or HostWSClient._applyEvent
      processes the event
  then:
    - HostState.pendingElicitation mirrors the host-side shape without
      the synthetic workflow-surface recompute that used to drop it

- id: WEB-UI-WS-CLIENT
  title: WebSocket client mapping and lifecycle
  surface: agents-js/web-ui
  priority: P0
  automation: automated
  test_file: apps/web-ui/src/ws-client.test.ts
  test_selector: 'HostWSClient'
  notes: |
    File also contains `mapSnapshot` and `mapModels` describes covering
    snapshot/model mapping helpers.
  given:
    - A gateway WebSocket endpoint
  when:
    - HostWSClient connects, receives messages, and emits state updates
  then:
    - Snapshot mapping produces the expected client-side shape
    - Model mapping produces the expected client-side shape
    - Lifecycle (connect/disconnect/reconnect) is stable

- id: WEB-UI-A2UI-DEMO
  title: A2UI demo surface renders end-to-end in the browser
  surface: agents-js/web-ui
  priority: P1
  automation: manual
  notes: |
    a2ui-demo.ts has no co-located test; browser-smoke exercises it via
    scripts/browser-smoke.ts.
  given:
    - web-ui loaded against a gateway configured with an A2UI agent
  when:
    - The A2UI demo surface receives a message
  then:
    - The surface renders the demo UI with the expected Lit components
