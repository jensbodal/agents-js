  surface: agents-js/web-ui
  priority: P1
  automation: automated
  test_file: apps/web-ui/src/host-bridge-url.test.ts
  test_selector: 'normalizeHostBridgeUrl'
  given:
    - Raw host bridge URLs in assorted forms
  when:
