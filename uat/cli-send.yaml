- id: CLI-SEND-ENV-FALLBACK
  title: send reads AGENTS_JS_SERVE_URL when --url is omitted
  surface: agents-js/cli/send
  priority: P1
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — help + validation'
  test_name: 'falls back to AGENTS_JS_SERVE_URL when --url is omitted'
  given:
    - Environment sets AGENTS_JS_SERVE_URL to a reachable base URL
    - A stub A2AClientController captures sendTurn calls
  when:
    - runSendCommand runs with a positional message and no --url
  then:
    - Exit code is 0
    - Controller.sendTurn is invoked exactly once with the positional message

- id: CLI-SEND-HAPPY-PATH
  title: send prints the agent reply to stdout and exits 0 on clean completion
  surface: agents-js/cli/send
  priority: P0
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — dispatch + happy path'
  test_name: 'happy path: sends message, prints agent reply, exits 0'
  given:
    - A stub A2AClientController that emits message.completed + terminal taskState
  when:
    - runSendCommand runs with --url and a positional message
  then:
    - Exit code is 0
    - Stdout contains the agent response text
    - sendTurn received the positional message with no metadata

