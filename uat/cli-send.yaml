- id: CLI-SEND-TEARDOWN
  title: send always clears controller target input, even on error
  surface: agents-js/cli/send
  priority: P2
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — error + elicitation paths'
  test_name: 'clears controller target input even on error'
  given:
    - A stub A2AClientController tracks calls to clearTargetInput()
  when:
    - runSendCommand runs (both happy-path and error-path variants)
  then:
    - clearTargetInput() is invoked exactly once per run regardless of exit code
  notes: |
    Covers both "clears controller target input after completion" and
    "clears controller target input even on error" tests in the
    send.test.ts `error + elicitation paths` describe block.
