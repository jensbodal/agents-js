- id: CLI-SEND-HELP
  title: send --help prints usage and exits 0
  surface: agents-js/cli/send
  priority: P0
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — help + validation'
  test_name: 'prints help and exits 0'
  given:
    - agents-js CLI binary is available
  when:
    - User runs `agents-js send --help`
  then:
    - Exits 0
    - Output contains "agents-js v"
    - Output contains "— send"
    - Output documents AGENTS_JS_SERVE_URL fallback

- id: CLI-SEND-PARSE-ARGS
  title: parseSendCommandArgs accepts documented flags and joins positional tokens
  surface: agents-js/cli/send
  priority: P1
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'parseSendCommandArgs'
  test_name: 'parses --url and positional message'
  given:
    - argv contains the supported send flags and a positional message
  when:
    - parseSendCommandArgs runs
  then:
    - --url / --harness / --raw / --help are captured
    - Multiple positional tokens are joined with a single space into args.message
    - Unknown flags throw a send-scoped diagnostic
    - Missing value for --url surfaces as a missing-value error
  notes: |
    Covers the full `parseSendCommandArgs` describe block in
    packages/cli/tests/send.test.ts — individual flag parses
    (--url, --harness, --raw, --help / -h), positional token joining,
    and the two negative paths (unknown flag, missing value).

- id: CLI-SEND-MISSING-MESSAGE
  title: send returns 1 when no message is provided
  surface: agents-js/cli/send
  priority: P1
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — help + validation'
  test_name: 'returns 1 when message is missing'
  given:
    - runSendCommand is invoked with --url but no positional message
  when:
    - runSendCommand runs
  then:
    - Exit code is 1
    - Stderr contains "Missing message"

- id: CLI-SEND-MISSING-URL
  title: send returns 1 when both --url and AGENTS_JS_SERVE_URL are absent
  surface: agents-js/cli/send
  priority: P1
  automation: automated
  test_file: packages/cli/tests/send.test.ts
  test_selector: 'runSendCommand — help + validation'
  test_name: 'returns 1 when --url and AGENTS_JS_SERVE_URL are both absent'
  given:
    - runSendCommand is invoked with no --url flag and an empty env
  when:
