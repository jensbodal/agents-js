- id: CLI-REGISTRY-ADD-A2A
  title: registry add with no flags defaults to kind=a2a
  surface: agents-js/cli/registry
  priority: P0
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'add with no flags defaults to kind=a2a (positional url)'
  given:
    - A URL is supplied positionally
  when:
    - User runs `agents-js registry add <url>`
  then:
    - Entry stored as kind=a2a with the supplied URL

- id: CLI-REGISTRY-ADD-ACP
  title: registry add --kind acp --harness stores an ACP entry
  surface: agents-js/cli/registry
  priority: P0
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'add --kind acp --harness stores an ACP entry'
  given:
    - --kind acp and a valid --harness name are supplied
  when:
    - User runs `agents-js registry add --kind acp --harness <name>`
  then:
    - Entry stored as kind=acp with the supplied harness name

- id: CLI-REGISTRY-ADD-ACP-MISSING-HARNESS
  title: registry add --kind acp without --harness fails
  surface: agents-js/cli/registry
  priority: P1
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'add --kind acp without --harness fails with exit 1'
  given:
    - --kind acp is supplied without --harness
  when:
    - User runs the command
  then:
    - Exit code is 1
    - Error message names the missing --harness flag

- id: CLI-REGISTRY-REMOVE
  title: registry remove deletes an entry
  surface: agents-js/cli/registry
  priority: P0
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'remove deletes an entry'
  given:
    - The registry contains at least one entry
  when:
    - User runs `agents-js registry remove <name>`
  then:
    - The entry is removed from the registry

- id: CLI-REGISTRY-LIST-EMPTY
  title: registry list returns 0 for empty registry
  surface: agents-js/cli/registry
  priority: P1
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'list returns 0 for empty registry'
  given:
    - Registry has no entries
  when:
    - User runs `agents-js registry list`
  then:
    - Exit code is 0
    - Output indicates no entries exist

- id: CLI-REGISTRY-INVALID-KIND
  title: registry add --kind with an invalid value fails
  surface: agents-js/cli/registry
  priority: P1
  automation: automated
  test_file: packages/cli/tests/registry.test.ts
  test_selector: 'runRegistryCommand'
  test_name: 'add --kind with invalid value fails'
  given:
    - --kind is supplied with an unrecognized value
  when:
    - User runs the command
  then:
    - Exit code is non-zero
    - Error message names the invalid kind value
