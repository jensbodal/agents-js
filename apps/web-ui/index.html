<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agents-js · Gateway Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: #0f1117; color: #c0caf5; font-family: system-ui, sans-serif; }
    #app { min-height: 100%; display: flex; flex-direction: column; }
    .dashboard-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 1.25rem 1.5rem; border-bottom: 1px solid #1f2335; }
    .dashboard-hero h1 { font-size: 1.25rem; font-weight: 600; }
    .dashboard-hero p { color: #7aa2f7; font-size: 0.85rem; margin-top: 0.25rem; }
    .dashboard-nav { display: flex; gap: 12px; }
    .dashboard-navlink { padding: 8px 14px; border: 1px solid #1f2335; border-radius: 10px; background: #11131c; color: inherit; text-decoration: none; font-size: 0.92rem; transition: border-color 0.15s ease, transform 0.15s ease; }
    .dashboard-navlink:hover { border-color: #7aa2f7; transform: translateY(-1px); }
    .dashboard-body { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 1.5rem; max-width: 960px; width: 100%; margin: 0 auto; }
    .dashboard-surface { min-height: 8rem; }
    .dashboard-summary { color: #9aa5ce; font-size: 0.9rem; margin-bottom: 12px; }
    .dashboard-error { color: #f7768e; padding: 12px 16px; border: 1px solid #43222a; border-radius: 10px; background: #1b1116; }
    .agent-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .agent-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #1f2335; border-radius: 10px; background: #11131c; }
    .agent-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .agent-dot.ok { background: #9ece6a; box-shadow: 0 0 0 3px rgba(158,206,106,0.15); }
    .agent-dot.down { background: #f7768e; box-shadow: 0 0 0 3px rgba(247,118,142,0.15); }
    .agent-name { font-weight: 600; }
    .agent-badge { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #7aa2f7; border: 1px solid #2a3252; border-radius: 6px; padding: 2px 7px; }
    .agent-status { margin-left: auto; color: #9aa5ce; font-size: 0.85rem; }
    .dashboard-viz { border: 1px solid #1f2335; border-radius: 12px; padding: 12px; background: #11131c; }
    .dashboard-viz canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/dashboard-root.ts"></script>
</body>
</html>
